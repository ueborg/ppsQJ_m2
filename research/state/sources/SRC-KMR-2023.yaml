inspection_caveat: >
  The load-bearing finding of proposal 2026-08-10-A (that KMR's B_L is a product
  of AVERAGES while ours is an average of PRODUCTS) rests on the Appendix B.1
  SECTION TITLE alone. The overbar notation is unambiguous, but the appendix body
  was not read and the finding should be confirmed against it before any
  quantitative KMR comparison is published.
supports_precisely:
  - "Two sets of non-commuting NON-PROJECTIVE measurements stabilise area-law phases of distinct topological order, with a topological phase transition between them. (abstract)"
  - "That transition is in a DIFFERENT universality class than in stroboscopic PROJECTIVE circuits. (abstract; Sec. 1)"
  - "With unitary dynamics the two topological phases are separated by a region of sub-volume entanglement scaling. (abstract)"
  - "The transition is well identified by a COMBINATION of the bipartite entanglement entropy and the topological entanglement entropy. (abstract)"
  - "The phase diagram is qualitatively captured by an analytically tractable NON-HERMITIAN model obtained by post-selecting the measurement outcome. (abstract)"
  - "They introduce a PARTIAL-POST-SELECTION continuous mapping associating topological indices of the non-Hermitian Hamiltonian to phases of the stochastic dynamics. (abstract)"
LOAD_BEARING_DEFINITION: >
  Contents p.2, Appendix B.1 is titled "Discussion of B_L = S_top_L(bar) x S_L(bar)
  for the particle number conserving limit alpha = 0". The overbars are trajectory
  averages, so KMR's B_L is a PRODUCT OF AVERAGES. Our stored B_L is an AVERAGE OF
  PRODUCTS. These are different quantities. See proposal 2026-08-10-A.
