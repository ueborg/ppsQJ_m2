inspected_sections: "abstract, Sec. I Introduction (pp. 1-3), table of contents"
supports_precisely:
  - "Born-rule and forced measurements in monitored Gaussian circuits of non-interacting fermions are in DIFFERENT universality classes. Numerical evidence plus a field-theory argument. (abstract; Sec. I)"
  - "The circuit considered, a 1D Majorana chain with no symmetry beyond fermion parity, is in AZ class DIII, and the AZ class is the SAME for Born and forced. (abstract)"
  - "The statistical-mechanics model is the PRINCIPAL CHIRAL non-linear sigma model with field variable an SO(n) matrix, in replica limits n->0 (forced) and n->1 (Born). Symmetry SO(n) x SO(n). (abstract; Sec. I)"
  - "Forced (n->0) is an Anderson-localization universality class; Born (n->1) is a NOVEL class beyond Anderson localization. (abstract)"
  - "Both transitions are driven by proliferation of Z2 topological defects. (abstract)"
  - "The loop-model-with-crossings circuit is a highly fine-tuned case in a universality class DIFFERENT from both, with SO(n) at n->1 rather than SO(n) x SO(n). (abstract; Sec. I)"
attribution_check: >
  The project invokes this source to establish that importing Fulga's class-DIII
  exponent (the n->0 forced/Anderson value) as the Born-rule MIPT exponent is
  unjustified. THAT ATTRIBUTION IS CORRECT and is now source-verified.
regime_and_assumptions:
  - "MONITORED RANDOM QUANTUM CIRCUITS, not continuous monitoring of a deterministic Hamiltonian. Our model is the latter."
  - "Circuit preserves no symmetry other than global fermion parity."
  - "Results are for the final-time Majorana correlation function and derived exponents."
does_not_establish_verified:
  - "A numerical value of nu for OUR model."
  - "That our deterministic-Kitaev continuous-monitoring model lies in the same universality class as their random circuit. That is an INFERENCE the project has not recorded as checked."
  - "Anything about partial post-selection. Jian et al. treat Born and forced as the two endpoints; the interpolating zeta ensemble is our own construction."
corroborates: >
  Independently confirms the frozen HANDOFF's note that the monitored-Majorana
  literature uses a PRINCIPAL-CHIRAL SO(N) target rather than the SO(2n)/U(n)
  coset the project's older derivations assumed.
invoked_for_claims: [CB-NU-TWO-001, CB-NLSM-001]
invoked_for: >
  The proposition that in class DIII the FORCED (n->0) and BORN-RULE (n->1)
  measurement transitions are DISTINCT universality classes. This is the load-bearing
  citation that invalidates importing Fulga's exponent as an MIPT exponent.
