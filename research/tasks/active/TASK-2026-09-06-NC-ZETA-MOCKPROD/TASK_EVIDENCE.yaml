- id: RT-ZCRIT-UNDERCORRECTED-001
  what: 'z_crit = Phi^-1((1 + 0.99^(1/n))/2) = 3.451 at n = 18 is the Sidak point for the
    maximum of n STANDARD NORMAL variables. The statistic actually used divides by SEMs estimated
    from R = 16 populations. Under the exact null the true exceedance of 3.451 is 3.04 %,
    not the intended 1 %; the correct 99th percentile is 3.87. The amendment''s own stated
    motivation is nevertheless confirmed independently: the superseded threshold of 2 has
    a null exceedance of 63.7 %.

    '
  method: '2 x 10^5 Monte Carlo replicates of 18 paired two-sample comparisons with R = 16
    per arm and SEMs estimated from the same draws.

    '
  verified_by:
  - red-team
  promotion_status: not_proposed
  tier: task-verified
  date: '2026-09-05'
  source_or_artifact: '2 x 10^5 Monte Carlo replicates of 18 paired two-sample comparisons
    with R = 16 per arm and SEMs estimated from the same draws.

    '
  what_was_verified: 'z_crit = Phi^-1((1 + 0.99^(1/n))/2) = 3.451 at n = 18 is the Sidak point
