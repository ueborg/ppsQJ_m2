- id: RT-RATEFLAT-MATCHED-001
  what: 'An attempt to break the refutation of rate ~ N_c^0.1871 FAILED: the refutation holds
    under a lambda-matched re-derivation. RATE35_MAX takes a MAXIMUM over populations, and
    the rungs compared have very different population counts (L=64: n=888 at N_c=1024 spanning
    lambda 0.1932-0.3532 against n=48 at N_c=4096 and 8192 at the single lambda 0.3032), so
    the published comparison is confounded by both sample size and lambda. At the one lambda
    all seven rungs share (0.3032) the median rate at L = 64 is 4.67 / 4.78 / 4.91 / 4.72
    / 4.60 / 4.75 ms at N_c = 64 / 256 / 1024 / 2048 / 4096 / 8192 -- flat over a 128x range.

    '
