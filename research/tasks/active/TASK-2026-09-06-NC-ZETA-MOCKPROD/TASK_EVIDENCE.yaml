- id: RT-RHO-CONVEXITY-001
  what: 'COST_MODEL.md section 4 states that rho "errs upward". One component errs DOWNWARD.
    rho(zeta) = rate(zeta)/rate(0.35) and rate(0.35) is obtained by log-log LINEAR interpolation
    between the measured zeta = 0.30 and 0.70 points; the ALGRD rate(zeta) curve is CONVEX
    in log-log (segment slopes 0.42 / 0.64 / 1.22 at L = 32), so that chord OVER-estimates
    rate(0.35) and therefore UNDER-estimates rho(0.70) by about 7-9 % (2.372 adopted against
    2.55 from the low-segment slope at L = 64). Small against the 2.43x --time margin, and
    partly offset by the max-over-L convention.

    '
  method: log-log segment slopes and two alternative estimates of rate(0.35) from TASK-2026-08-11-ALGRD/results/b0_L{32,64,96,128}.json.
  verified_by:
