- id: RT-SCRATCH-INGEST-001
  what: 'During this review the shipped loader analysis/mockprod_analysis.py::load and preflight
    check P14 both globbed <task>/**/results/*.json with no provenance filter, and ingested
    the red team''s synthetic populations from the task''s own scratch/ directory as measurements
    (P14 reported 27 false duplicates). Both files were patched during the review with a path-substring
    exclusion for /scratch/. The residual gap: the loader still accepts ANY JSON under the
    task tree carrying the right fields, and does not deduplicate by seed or cross-check a
    manifest, so a copied, stale or foreign results file elsewhere in the tree would still
    enter the curves and would count as an independent population.

    '
