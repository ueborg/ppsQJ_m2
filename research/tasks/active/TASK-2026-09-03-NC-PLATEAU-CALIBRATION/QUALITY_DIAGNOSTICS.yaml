# QUALITY_DIAGNOSTICS — TASK-2026-09-03-NC-PLATEAU-CALIBRATION
#
# Every curve-quality and crossing-quality diagnostic this campaign computes,
# where it is implemented, and -- for the diagnostics that already have values
# from the existing corpus -- what those values are.
#
# NOTHING HERE IS A VERDICT ON NEW DATA. The new-data columns are empty because
# no HPC job has been submitted; the analysis that fills them is frozen and
# demonstrated to run to completion on zero results.
task_id: TASK-2026-09-03-NC-PLATEAU-CALIBRATION
implemented_by: analysis/nc_plateau_analysis.py
specification: ANALYSIS_SPEC.yaml   # authoritative; this file is a register

standing_rules_enforced:
  uncertainty_source: >
    Across INDEPENDENT POPULATIONS, always. Within-clone spread is a diagnostic
    and is never the standard error of a population mean.
  vif: >
    Reported as a VARIANCE-EQUIVALENCE diagnostic ONLY. It is never used as a
    bias diagnostic and appears in no adequacy verdict anywhere in this task.
  genealogy: >
    Founder count and genealogical ESS are diagnostics. Neither is read as a
    literal number of independent samples; genealogy may collapse completely
    without implying an information ceiling.
  drift_not_bias: >
    Finite-N_c movement is called DRIFT. It is never called bias, because the
    N_c -> infinity target is unknown.
  matched_R: >
    Every primary statistic uses matched R across the rungs it compares. Blocks
    are cut in SEED ORDER, which is observable-blind. Full-R views are secondary
    and carry no curve-quality or crossing authority.
  forbidden:
    - smoothing
    - interpolation replacing a measured point
    - imposed monotonicity
    - removal of a lambda point for being inconvenient
    - any value-based exclusion
    - a special fit across a reuse join
  audit_block: >
    NC_PLATEAU_RESULTS.json carries an audit block asserting each of the above
    about the run that produced it, so the assertion travels with the numbers.

per_lambda_diagnostics:      # section 10 of the brief, per measured point
  - mean_CMI
  - across_population_SEM
  - across_population_sd
  - VIF                              # variance equivalence only
  - N_eff                            # diagnostic only
  - split_half_stability             # disjoint seed-ordered blocks
  - leave_one_population_out_spread  # reported in units of SEM
  - standardized_outliers            # max |z| and count beyond 3 sigma
  - non_finite_clone_fraction        # cell flagged SUSPECT above 1 %
  - brentq_fallbacks                 # reported, NEVER an exclusion
  - Var_log_carried_weight           # NEW; absent from 100 % of the prior corpus

per_curve_diagnostics:
  - adjacent_increments
  - increment_SEMs
  - increment_resolution             # is each increment resolved at 95 %
  - second_differences
  - roughness                        # RMS second difference, absolute
  - roughness_in_SEM                 # and in units of mean SEM

cross_L_diagnostics:
  statistics:
    - raw_sign_changes
    - resolved_sign_changes            # both bracketing points resolved at 95 %
    - bootstrap_crossing_count_histogram
    - bootstrap_crossing_interval
    - bootstrap_crossing_median
    - fraction_exactly_one_crossing
    - endpoint_induced_status
    - leave_one_lambda_out_stability
    - split_half_crossing_stability
  bootstrap:
    replicates: 4000
    model: Gaussian on each point's across-population SEM
    seed: 20260903                   # fixed so the number is reproducible
  endpoint_rule: >
    A crossing within one grid step of either end is ENDPOINT_INDUCED and is
    reported as a boundary-sensitive locator, not as a located crossing. This is
    the defect TASK-2026-09-03-MOCK-LOWLAMBDA-EXTENSION was created to repair
    and it is not allowed to recur silently. It is also what killed the cheap
    three-lambda version of campaign B2 before submission.

