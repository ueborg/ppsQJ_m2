# MANDATORY red-team output. Charter section 7 Stage 8.
# Validated by: research/tools/validate_redteam.py
# A MISSING ATTACK IS A HARD FAILURE, not a warning.

task_id: TASK-2026-08-10-AMP096
candidate: >
  Five candidate statements on the historical Cut B amplitude A = 0.96.
  C1: A=0.96 was an inverse-variance-weighted log-log fit of lambda_c=A*zeta^phi to six
  1/sqrt(L)-extrapolated lambda_c values over zeta<=0.3, in the lambda_c parameterization;
  "it is not and never was an r_c-type prefactor".
  C2: A=0.96 and phi=0.502 were co-generated by choosing the crossing-extrapolation exponent
  p=1/2, justified by assuming nu=2; the same data give A=0.53/0.66/0.79/0.96 for p=2/1/0.7/0.5,
  and dropping zeta=0.30 gives phi=0.259, A=0.406.
  C3: under a single-power ansatz holding to zeta=1, A = lambda_c(1) identically for every phi,
  so measured lambda_c(1)=0.43-0.49 excludes A=0.96 by a factor of two with no reference to any exponent.
  C4: OBS-BLPROD-001 and OBS-BLKMR-001 agree to a median 0.31 percent in crossing position and
  about 1 percent in amplitude, so observable convention explains none of the 0.96-vs-0.49 gap.
  C5: no Cut B boundary amplitude is estimator-stable on data we hold: A at fixed phi=1/2 spans
  0.42-0.66, and on the July campaign the same estimator over the same window gives
  A = 0.543 +/- 0.010, above CB-AMP-001's asserted 0.49-0.51 band.
reviewer: redteam-stage8-independent (adversarial pass, not the proposer)
date: 2026-08-10

inputs_seen:
  - claim: [CB-AMP-096-001, CB-AMP-001, CB-PARAM-001, CB-WINDOW-001, CB-PHI-HALF-001,
            CB-PHI-LINEAR-001, CB-NU-001, CB-NU-TWO-001, CB-YZETA-001, METH-EXTRAP-001,
            METH-TREQ-001]
  - evidence: [EV-EXEC-AUDITREPRO-001, EV-DATA-AGGCASEB-001, EV-DATA-BOUNDARYCSV-001,
               OBS-BL-001, OBS-BLPROD-001, OBS-BLKMR-001, OBS-CMI-001,
               DEC-OBS-001, DEC-CITATION-001, DISP-PHI-001, DISP-WINDOW-001,
               SRC-KMR-2023, SRC-LMR-2025,
               "agent_reports/literature.json", "agent_reports/theory.json",
               "agent_reports/numerics.json",
               "PROVENANCE ONLY: analysis/lambda_c_phi_analysis.md, theory/Y_ZETA_DERIVATION.md,
                theory/HANDOFF.md, audit/2026-08-10/03_AMPLITUDE_TRACE.md",
               "OWN RECOMPUTATION: results/boundary_aggregate.csv, read-only, this review"]
  - lead_summary_seen: false
  - not_read_deliberately: >
      research/tasks/active/TASK-2026-08-10-AMP096/RECOMMENDATION.md, RESEARCH_MEMO.md,
      ASSESSMENT_AH.md, CANDIDATES.md, PROBLEM_MEMO.md, NOVELTY_MATRIX.md and every other
      lead-authored synthesis in the task directory. The case against below was reconstructed
      from canonical state, the raw worker JSONs, provenance documents and my own read-only
      recomputation on results/boundary_aggregate.csv.

attacks:

  A1_already_solved_elsewhere:
    attempted: true
    finding: >
      FATAL, and it hits C1, C2, C3 and the second half of C5. Canonical state already holds
      every load-bearing element of C1-C3 under other IDs.
      (a) C1's generative account is already the structured content of the claim it says it
      corrects: CB-AMP-096-001 carries "parameterization: lambda_c" and
      scope: "1/sqrt(L) extrapolation of Binder crossings, small-zeta fit, May 2026".
      That IS C1. The only thing C1 contradicts is the free-text confidence_basis of the same
      file, which is an annotation, not a claim, and carries evidence: [].
      audit/2026-08-10/03_AMPLITUDE_TRACE.md line 41 already records the origin as
      "from a 1/sqrt(L) extrapolation table giving phi = 0.502 +/- 0.026".
      (b) C2 is METH-EXTRAP-001 restated. That claim exists, is already withdrawn, and its
      provenance_note already records the identical four-form comparison with the identical
      chi2/dof values (10.7, 17.2, 13.4, 28.2) and already calls the p=1/2 selection
      "circular on an unmeasured nu". CB-NU-TWO-001's provenance_note states verbatim:
      "Also underpins the 1/sqrt(L) extrapolation choice, which is therefore circular."
      C2 adds only the four A values and a leave-one-out; the epistemic content is prior.
      (c) C3 is the recorded 2026-06-10 correction rediscovered. theory/HANDOFF.md:395 reads
      "global fit lambda_c~0.96 sqrt(zeta) does NOT pass through lambda_c(1)~0.5" and
      theory/Y_ZETA_DERIVATION.md:191-193 reads "The lambda_c fit gives A ~ 0.50 and DOES pass
      through lambda_c(1) ~ 0.5". That is C3, in June 2026, and it is the recorded basis of
      CB-AMP-001. agent_reports/theory.json labels its own version "POSTDICTION".
      (d) C5's "spans 0.42 to 0.66" is CB-WINDOW-001 (window drift, verdict
      strongly_window_dependent, scan already recorded) plus DEC-OBS-001 (locator dependence,
      already the reason OBS-BL-001 was demoted). Re-deriving both is not a result.
    evidence: [CB-AMP-096-001, METH-EXTRAP-001, CB-NU-TWO-001, CB-WINDOW-001, DEC-OBS-001,
               CB-AMP-001, "provenance: theory/HANDOFF.md:395,445; theory/Y_ZETA_DERIVATION.md:191-193;
               audit/2026-08-10/03_AMPLITUDE_TRACE.md:7-13,41"]
    severity: fatal
    unresolved: >
      One genuinely new item survives A1 and it is bookkeeping, not science: CB-AMP-096-001's
      evidence_note "Original supporting analysis not located on disk" is false;
      analysis/lambda_c_phi_analysis.md is on disk and tracked at commit 6c9c843. That is a
      provenance correction and cannot support any evidence-class claim.
    effect_on_candidate: kill

  A2_follows_trivially_from_assumptions:
    attempted: true
    finding: >
      FATAL for C3. "A = lambda_c(1) for every phi under a single-power ansatz reaching zeta=1"
      is the substitution zeta=1 into A*zeta^phi. It is 1^phi = 1. It carries no information
      about the data, the observable, the estimator or the physics; all its content sits in the
      premise that one power law holds up to and including zeta=1, and in the number assigned to
      lambda_c(1). agent_reports/theory.json concedes this ("elementary derivation ... algebra;
      assumptions stated in the sentence") and separately concedes that its zeta convention
      premise is unverified: SRC-LMR-2025 records the zeta=1-is-Born convention as
      "taken from project notes, not checked against the paper", and theory.json states that if
      the convention is inverted the relation is vacuous. A tautology plus an unverified
      convention plus a finite-L endpoint number is not an exponent-free exclusion; it is an
      assumption-transport. C2 has a milder version of the same defect: A and phi both move with
      p because they are the intercept and slope of one two-parameter log-log fit, so
      "co-generated" is arithmetic, not a discovery.
    evidence: [CB-WINDOW-001, SRC-LMR-2025, "agent_reports/theory.json findings 5, 6"]
    severity: fatal
    unresolved: >
      Whether zeta=1 is our Born endpoint at all is unverified against SRC-LMR-2025's body.
      Until read, C3 has no established referent.
    effect_on_candidate: kill

  A3_baseline_disadvantaged:
    attempted: true
    finding: >
      MATERIAL-to-FATAL, and it is self-inflicted. C1 and C5 correctly identify that the 0.96
      and the 0.49 were never measured with the same estimator (extrapolated vs not). C3 then
      commits exactly that error in the opposite direction: it tests an amplitude produced by
      1/sqrt(L) extrapolation against an endpoint value that is NOT extrapolated. I ran the
      matched comparison read-only on results/boundary_aggregate.csv: at zeta=1.0 the available
      crossings are (64,80)=0.4851, (64,96)=0.4891, (80,96)=0.4932 -- monotonically INCREASING
      with L_geom -- and a 1/sqrt(L_geom) extrapolation, the historical estimator, gives
      lambda_c^inf(1) = 0.569 (1/L gives 0.529), not 0.43-0.49. C3's "factor of two" is
      1.7 on the matched estimator and depends on the very estimator choice C1/C2 identify as
      the root cause. C5 has the mirror problem: it compares CB-AMP-001's wide-pair
      (L2 >= 2 L1) median-over-pairs estimator against a dataset in which exactly one wide pair
      exists (64,128), so "median over pairs" degenerates to a single pair, and against
      theory.json's loosened L2/L1 >= 1.4 criterion, which is a different estimator again.
    evidence: [CB-AMP-001, EV-DATA-BOUNDARYCSV-001, EV-EXEC-AUDITREPRO-001,
               "own read-only recomputation on results/boundary_aggregate.csv, zeta=1.0 cells,
                L in {64,80,96,112}"]
    severity: fatal
    unresolved: >
      No defensible L-extrapolation exists on either dataset (both workers say so). Until one
      does, no comparison between the historical extrapolated number and any current number is
      estimator-matched, in either direction.
    effect_on_candidate: kill

  A4_gain_from_extra_information_or_resources:
    attempted: true
    finding: >
      MATERIAL. Everything C5 adds beyond canonical state comes from one previously unanalysed
      dataset, results/boundary_aggregate.csv, whose metadata are the worst in the project:
      EV-DATA-BOUNDARYCSV-001 records T, N_c, burn_in, seeds, generating script, date and
      git_commit as all absent. The comparison dataset EV-DATA-AGGCASEB-001 has T/L varying
      0.80-2.0 and falling below 1 at L >= 128. Both workers flag the unmatched-T/L confound
      and neither resolved it; METH-TREQ-001 exists precisely because T/L may bias extraction
      and is itself an unsupported conjecture. So the "independent campaign disagrees" result is
      purchased with a dataset that cannot be shown to be at matched operating conditions. The
      same applies to C4: the OBS-BLKMR-001 recomputation required a DIFFERENT aggregate
      (agg_pps_clone_guided_prod.pkl) because the canonical one lacks S_AB_mean, so the locator
      comparison is not performed on the dataset the claim under test rests on.
    evidence: [EV-DATA-BOUNDARYCSV-001, EV-DATA-AGGCASEB-001, METH-TREQ-001, OBS-BLKMR-001,
               "agent_reports/numerics.json gaps 4 and 6; agent_reports/theory.json gap 4"]
    severity: material
    unresolved: >
      T and N_c for the July campaign are recoverable from results/ruche_pull per-realisation
      JSONs; burn_in, seeds and git_commit are not. Nobody recovered them.
    effect_on_candidate: narrow_scope

  A5_fails_under_dependence_causality_or_boundary_cases:
    attempted: true
    finding: >
      FATAL for C5 and it compounds C3. I recomputed the July-campaign wide-pair (64,128)
      crossings read-only. Two of the points inside C5's [0.05,0.85] window are not crossings:
      (i) at zeta=0.8 the only sign change of B_L(64)-B_L(128) is in the LAST grid interval, at
      the final shared lambda = 0.7155, where B_L(64) = 0.0003 +/- 0.0001 and B_L(128) = 0.0000
      +/- 0.0000. Both curves have collapsed to numerical zero deep in the disentangled phase;
      the "crossing" is a 3e-4 noise artifact pinned at the top of the sampled lambda grid
      (grid max 0.7155), in a cell where L=128 has only 4 lambda points. (ii) at zeta=0.05 the
      difference changes sign FIVE times across seven grid points
      (-0.137, +0.522, +0.052, -0.146, +0.216, +0.586, +0.108), so the crossing is not defined
      and depends entirely on a first/last/median rule -- my first-crossing rule gives 0.071
      against numerics.json's 0.124 for the same pair. Removing only the zeta=0.8 pseudo-crossing
      moves the amplitude from 0.596 to 0.550 on my weighting; restricting to zeta<=0.4, where
      the crossings are clean, gives A(phi=1/2) = 0.4943 -- identical to CB-AMP-001's 0.494. The
      claimed 5-sigma excess is an endpoint/boundary-case artifact of the fit window, not a
      dataset disagreement. Boundary cases also break C3: at zeta=1.0 the CSV has NO L=128 row at
      all and L=112 has 3 lambda points spanning 0.30-0.45, so no wide pair exists and the only
      crossings come from (64,96) and (80,96), two overlapping pairs sharing L=96 on a
      three-L subset with n_real=12.
    evidence: [EV-DATA-BOUNDARYCSV-001, CB-AMP-001,
               "own read-only recomputation on results/boundary_aggregate.csv:
                (zeta=0.8,L=128) has 4 lambda points; (zeta=0.9,L=128) has 1; zeta=1.0 has no L=128;
                B_L(64)=0.0003, B_L(128)=0.0000 at lambda=0.7155"]
    severity: fatal
    unresolved: >
      No crossing-validity criterion (minimum separation relative to B_L_se, monotonicity in L,
      interior-of-grid requirement) is defined anywhere in state. Until one is, wide-pair
      crossings at large zeta on this dataset are not measurements.
    effect_on_candidate: kill

  A6_measures_a_proxy_not_the_phenomenon:
    attempted: true
    finding: >
      MATERIAL. Every number in C1-C5 is a crossing of OBS-BLPROD-001 (or its retired alias),
      which OBS-BLPROD-001 itself states is NOT a Binder cumulant, and which DEC-OBS-001 demoted
      for exponent extraction because its explicit ln L factor biases fitted exponents LOW.
      The phenomenon asserted is the location of the Cut B phase boundary; the measured quantity
      is where two curves of a ln-L-contaminated product observable cross at finite L and finite
      T. Worse for C1-C3: the reconstruction assumes the May-2026 B_L field is the same
      average-of-products quantity as OBS-BLPROD-001. OBS-BL-001's audit_action_required
      ("confirm the stored definition per dataset generation") is OPEN for pre-June data, and
      numerics.json lists this as "the single most load-bearing unverified assumption". If the
      May-era field differs, the entire 0.96 reconstruction is a cross-observable comparison and
      C1's parameterization verdict is unsupported. Additionally, theory.json's KMR
      recomputation used the aggregate field S_mean, which numerics.json identifies as
      OBS-SHALF-TAVG-001 (time-averaged post-burn-in), NOT the final-time S_AB required by
      OBS-BLKMR-001 -- so one of the two "independent" confirmations behind C4 did not compute
      OBS-BLKMR-001 at all.
    evidence: [OBS-BLPROD-001, OBS-BL-001, OBS-CMI-001, DEC-OBS-001, OBS-SHALF-TAVG-001,
               OBS-BLKMR-001, "agent_reports/numerics.json contradiction 3 and gap 3"]
    severity: material
    unresolved: "The May-era generating worker has not been read. It may not be recoverable."
    effect_on_candidate: downgrade_status

  A7_disappears_under_realistic_conditions:
    attempted: true
    finding: >
      MATERIAL. Under the operating conditions the project actually has -- L <= 160, T/L below 1
      at the largest L, n_real 5-12, no bootstrap on crossings, no corrections to scaling -- the
      only part of the candidate set that does not evaporate is the non-novel historical
      narrative. Both workers report that the decisive test (L-extrapolation) is degenerate on
      current L ranges: per-zeta intercepts are non-monotone, one is negative (zeta=0.9 gives
      -0.45), and wide-pair extrapolations return lambda_c^inf outside the sampled lambda grid at
      both ends. C5's own strongest evidence therefore cannot be produced under realistic
      conditions, and C5 correctly says so about the extrapolated variants while still folding
      those variants (0.578, 0.658) into the 0.42-0.66 span it advertises as the finding. A
      spread built from estimators the author calls indefensible does not measure instability of
      the amplitude; it measures the inclusion of indefensible estimators.
    evidence: [CB-WINDOW-001, DISP-WINDOW-001, EV-DATA-AGGCASEB-001,
               "agent_reports/numerics.json findings 13, 14; agent_reports/theory.json finding 11"]
    severity: material
    unresolved: "Whether ANY window is asymptotic remains open (DISP-WINDOW-001). Unchanged by this task."
    effect_on_candidate: narrow_scope

  A8_statistically_or_practically_negligible:
    attempted: true
    finding: >
      FATAL for C5's headline and MATERIAL for C4. C5 asserts A = 0.543 +/- 0.010 is above the
      0.49-0.51 band, i.e. roughly five sigma. The +/- 0.010 is a parametric bootstrap on stored
      B_L_se only. The same report states, one finding earlier, that "the dominant uncertainty is
      not statistical" and that the same estimator moves to 0.480 on a different window of the
      same data. Quoting a statistical-only interval against a systematics-dominated quantity
      manufactures a significance that does not exist; my A5 recomputation shows the excess is
      carried by two window-edge points, one of which is a 3e-4 noise artifact. Moreover
      CB-AMP-001's own recorded window scan and numerics' extension show the SAME dataset yields
      0.48-0.66 across windows, so 0.543 is interior to what CB-AMP-001's own data produce and is
      not a dataset-level contradiction of anything. Practical negligibility also bites C1 and
      C4: C1's correction changes no number, no status and no dependent claim -- CB-AMP-096-001
      remains withdrawn, CB-AMP-001 remains provisional, both disputes remain open, and both
      workers say so explicitly. C4 refutes a proposition nobody in state advanced: neither
      CB-AMP-096-001 nor CB-AMP-001 nor OBS-BLKMR-001 ever attributes the 0.96/0.49 gap to the
      PROD/KMR distinction; OBS-BLKMR-001 raises that distinction only for comparisons AGAINST
      KMR. Refuting a strawman at 1 percent precision is a null result presented as a finding,
      and the reported "median 0.31 percent" conceals a maximum disagreement of 7.48 percent.
    evidence: [CB-AMP-001, CB-WINDOW-001, OBS-BLKMR-001, CB-AMP-096-001,
               "agent_reports/numerics.json findings 8, 10, 16"]
    severity: fatal
    unresolved: >
      An honest total-error budget for any Cut B amplitude does not exist. Nobody has produced
      one; the task did not produce one either.
    effect_on_candidate: kill

  A9_simpler_explanation_accounts_for_evidence:
    attempted: true
    finding: >
      FATAL for C1's second clause. C1 asserts the 0.96 "is not and never was an r_c-type
      prefactor" and both workers infer that CB-AMP-096-001's confidence_basis is an audit error
      or "a hardened juxtaposition". The simpler explanation is that the annotation is an
      accurate record of a real, documented 2026-06-10 reinterpretation. CB-AMP-096-001's
      provenance_note names its source: "Correction written into Y_ZETA_DERIVATION.md
      2026-06-10". That file exists and says at line 191-192: "Symptom in our own data
      (CORRECTED 2026-06-10): the 0.96 prefactor belongs to r_c = lambda_c/(1-lambda_c), NOT to
      lambda_c." theory/HANDOFF.md:351 and :445 say the same: "the 0.96 is the r_c prefactor,
      not lambda_c". So from June 2026 onward the 0.96 WAS being used as an r_c-type prefactor.
      C1's "never" is false as a statement about the project's history; what is true, and much
      weaker, is that the number was not GENERATED that way in May. Neither worker report shows
      any sign of having read Y_ZETA_DERIVATION.md section 7/11 -- the document the claim file
      explicitly cites -- before declaring the claim file wrong. A second simple explanation
      covers the whole amplitude story without any of C1-C5: an unstable extrapolation on
      L <= 128 with chi2/dof ~ 11 produced a number, later non-extrapolated fits on rebuilt data
      produced a smaller one, and the difference is estimator instability, which CB-WINDOW-001
      and METH-EXTRAP-001 already record.
    evidence: [CB-AMP-096-001, METH-EXTRAP-001, CB-WINDOW-001,
               "provenance: theory/Y_ZETA_DERIVATION.md:14,191-193; theory/HANDOFF.md:351,379,445"]
    severity: fatal
    unresolved: >
      Whether any contemporaneous r_c fit numerically landing near 0.96 exists was not checked
      by anyone. EV-EXEC-AUDITREPRO-001 gives r_c amplitudes 0.692 and 0.874 and numerics
      reports 0.949 +/- 0.035 on the July CSV and 1.021 under extrapolation -- i.e. the r_c
      family does reach 0.95. The numerical coincidence that made the June reading believable is
      real and unexplained.
    effect_on_candidate: kill

extensions:
  X1_window_chosen_after_seeing_the_answer:
    attempted: true
    finding: >
      Present on both sides and unremedied. The historical zeta<=0.3 window is justified in the
      primary document only as "the regime where the small-zeta multicritical asymptote should
      apply", i.e. by the answer sought; and the p=1/2 form was selected as the lowest chi2/dof
      of four poor fits (10.7 vs 13.4, 17.2, 28.2) -- a fact C2 omits while charging pure
      theory-driven circularity. On the candidate side, C5 uses [0.05,0.85] because that is
      CB-AMP-001's window, and my A5 check shows the entire claimed excess lives at that window's
      edges: zeta<=0.4 reproduces 0.494 exactly. No window pre-registration exists anywhere.
    severity: material
  X2_parameterization_stated_and_comparisons_matched:
    attempted: true
    finding: >
      Parameterization is stated throughout (CB-PARAM-001 settles the lambda_c/r_c Jacobian), but
      comparisons are NOT matched: extrapolated vs non-extrapolated (C3, C5), wide-pair vs
      L2/L1>=1.4 (C3 vs C5 on the same file), OBS-BLPROD-001 vs OBS-CMI-001 pooled into one
      "span" (C5), and OBS-SHALF-TAVG-001 substituted for S_AB (theory's C4 route). The two
      workers also disagree about the same dataset's large-zeta behaviour -- "flat 0.45-0.55 for
      zeta>=0.5, largest ratio 0.684" versus lambda_c(0.8)=0.716 with ratio 0.80 -- because they
      used different pair criteria. That disagreement is unreconciled in the candidate set.
    severity: material
  X3_single_cell_single_L_or_single_pair:
    attempted: true
    finding: >
      Yes, repeatedly. C5's July-campaign result rests on ONE wide pair (64,128) per zeta, so
      "median over pairs" is a single number. C3's lambda_c(1) rests on two overlapping pairs
      sharing L=96 from a 3-L subset with no L=128 present at zeta=1.0 at all. C4 rests on one
      dataset (877 records) because the canonical aggregate lacks S_AB_mean. C1-C2 rest on six
      tabulated points of which one (zeta=0.30) carries the fit and one more (zeta=0.02) is
      flagged as chi2/dof=12.8 by the source itself.
    severity: fatal
  X4_alternative_observable_or_estimator_disagrees:
    attempted: true
    finding: >
      Yes, at magnitudes the candidates treat asymmetrically. OBS-CMI-001 gives 0.425 where
      OBS-BLPROD-001 gives 0.494 (14 percent, far exceeding quoted statistical error) and
      DEC-OBS-001 prefers OBS-CMI-001. C4 reports the locator pair that agrees and states the
      convention "explains none" of the gap; the locator pair that disagrees by 14 percent is
      reported in the same breath as C5's evidence for instability. The two candidates therefore
      use the same locator-dependence fact in opposite directions.
    severity: material
  X5_cited_path_actually_exists:
    attempted: true
    finding: >
      Checked. results/boundary_aggregate.csv exists and I stat'ed and recomputed from it
      directly (470 rows, L in {64,80,96,112,128}, 14 zeta). analysis/lambda_c_phi_analysis.md
      exists and is tracked. theory/Y_ZETA_DERIVATION.md and theory/HANDOFF.md exist at the lines
      cited above. NOT verified by me: DATA_INTERNSHIP/Data/pps_aggregates/agg_caseB_combined.pkl
      and agg_pps_clone_guided_prod.pkl (external data root), and the /tmp/*.py scripts behind
      every number in agent_reports/theory.json, which are ephemeral by construction and were
      not preserved into the task directory -- unlike numerics, whose probes are under scratch/.
      Theory's findings are therefore currently unreproducible as written.
    severity: material
  X6_depends_on_a_claim_that_has_moved:
    attempted: true
    finding: >
      Yes, and in the candidates' favour, which is why they add nothing: CB-NU-TWO-001 is
      contradicted, METH-EXTRAP-001 is withdrawn and review_status stale, CB-YZETA-001 is
      withdrawn, OBS-BL-001 is retired. The dependency cascade already did the work C2 claims to
      do. Conversely C3 depends on SRC-LMR-2025's zeta convention, which that source records as
      unverified against the paper, and on CB-WINDOW-001, which denies the single-power premise
      C3 requires.
    severity: fatal
  X7_ignores_a_recorded_negative_result:
    attempted: true
    finding: >
      Yes. METH-EXTRAP-001 is a recorded negative result stating precisely C2, and neither worker
      cites it. CB-AMP-096-001's own scope field states precisely C1, and both workers present C1
      as contradicting that file. The 2026-06-10 correction in Y_ZETA_DERIVATION.md states
      precisely C3, and neither worker cites it. Preserving negative results (charter 4.4) also
      means not re-deriving them as new findings.
    severity: fatal

verdict: killed
verdict_reason: >
  Killed. Six attacks land at fatal (A1, A2, A3, A5, A8, A9) and three at material (A4, A6, A7),
  and rule R9 requires the verdict on any fatal.
  (1) Novelty: C1, C2 and C3 are already canonical under other IDs -- CB-AMP-096-001's own
  parameterization and scope fields, METH-EXTRAP-001 (withdrawn, same four-form table, same
  chi2 values, same circularity charge), CB-NU-TWO-001's provenance_note, and the 2026-06-10
  correction in Y_ZETA_DERIVATION.md:191-193 which is verbatim C3's endpoint argument. C5's
  "spans 0.42-0.66" is CB-WINDOW-001 plus DEC-OBS-001.
  (2) Truth: C1's clause "never was an r_c-type prefactor" is false as history.
  theory/Y_ZETA_DERIVATION.md:191 and theory/HANDOFF.md:351,445 record the project using the
